</g>
<!-- paws and heart wallet -->
<ellipse cx="128" cy="338" rx="43" ry="27" fill="#302936"/>
<ellipse cx="292" cy="338" rx="43" ry="27" fill="#302936"/>
<g filter="url(#shadow)">
  <rect x="143" y="306" width="134" height="83" rx="25" fill="url(#wallet)" stroke="#c95e91" stroke-width="5"/>
  <path d="M146 328 Q210 311 274 328" fill="none" stroke="#ffd9e9" stroke-width="6"/>
  <path d="M210 346 C187 320 163 347 210 376 C257 347 233 320 210 346Z" fill="#fff4fa" stroke="#d96d9f" stroke-width="3"/>
  <circle cx="264" cy="352" r="7" fill="#fff1a8"/>
</g>
<!-- sparkles -->
<g fill="#f0b3ce">
  <path d="M42 155 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7Z"/>
  <path d="M371 151 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5Z"/>
  <path d="M343 48 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4Z"/>
</g>
</svg>