  <circle cx="13" cy="-4" r="9" fill="#fff1a8" stroke="#e8a9bd" stroke-width="2"/>
  <circle cx="8" cy="11" r="9" fill="#fff1a8" stroke="#e8a9bd" stroke-width="2"/>
